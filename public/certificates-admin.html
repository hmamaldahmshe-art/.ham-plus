<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>هام | طلبات تسجيل الأجهزة</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c110f;color:#f0f8f1;font:16px system-ui,-apple-system,sans-serif}main{max-width:1050px;padding:24px 14px;margin:auto}a{color:#b8f46a}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.card{border:1px solid #324b38;background:#19231c;padding:20px;border-radius:15px;margin-top:20px}input,select{padding:10px;border-radius:9px;border:1px solid #59715b;background:#101811;color:white;font:inherit}button{padding:10px 14px;background:#b8f46a;color:#142511;border:0;border-radius:9px;cursor:pointer;font:inherit;font-weight:700;margin:4px}button:disabled{opacity:.5}.hide{display:none}.scroll{overflow-x:auto}table{border-collapse:collapse;min-width:760px;width:100%}td,th{border-bottom:1px solid #344537;padding:13px 10px;text-align:right;overflow-wrap:anywhere;max-width:300px}p{color:#c5d0c6;line-height:1.7}.warn{color:#f5c88b}</style></head><body><main><header class="top"><h1>هـ HAM | إدارة طلبات الشهادات</h1><a href="/admin">لوحة المدير</a></header><p>هذه صفحة خاصة بالمدير. لا ترسل بيانات UDID إلى GitHub أو أي طرف آخر دون موافقة العميل.</p><section class="card" id="loginPanel"><h2>دخول المدير</h2><form id="login"><input type="password" id="password" autocomplete="current-password" placeholder="كلمة مرور لوحة المدير" required><button>دخول</button></form></section><section class="card hide" id="dashboard"><div class="top"><h2>طلبات العملاء</h2><button id="refresh">تحديث</button></div><div class="scroll"><table><thead><tr><th>العميل</th><th>الجهاز</th><th>UDID</th><th>المصدر</th><th>تاريخ الطلب</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="rows"></tbody></table></div><p class="warn">لا تعتبر UDID المدخل يدويًا موثقًا قبل التحقق منه.</p></section><p id="message" role="status"></p></main><script>'use strict';const $=x=>document.getElementById(x);async function api(url,options={}){const r=await fetch(url,{cache:'no-store',credentials:'same-origin',...options});const v=await r.json().catch(()=>({error:'تعذر إكمال الطلب'}));if(!r.ok)throw Error(v.error||'تعذر إكمال الطلب');return v}
async function refresh(){const data=await api('/api/admin/certificates/orders');$('loginPanel').classList.add('hide');$('dashboard').classList.remove('hide');$('rows').replaceChildren();for(const order of data.orders.slice().reverse()){const tr=document.createElement('tr');function cell(content){const td=document.createElement('td');td.textContent=content||'—';tr.appendChild(td);return td}cell(order.name);cell(order.deviceName);cell(order.udid);cell(order.source);cell(order.createdAt);const selection=cell(''),select=document.createElement('select');for(const [value,label] of [['pending','جديد'],['processing','قيد المعالجة'],['ready','جاهز'],['delivered','مكتمل'],['cancelled','ملغي']]){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option)}select.value=order.status;selection.append(select);const actions=cell(''),save=document.createElement('button');save.textContent='حفظ';save.addEventListener('click',async()=>{save.disabled=true;try{await api('/api/admin/certificates/orders/'+order.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});$('message').textContent='تم تحديث الطلب';await refresh()}catch(e){$('message').textContent=e.message}finally{save.disabled=false}});actions.append(save);$('rows').append(tr)}}
$('login').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';await refresh()}catch(err){$('message').textContent=err.message}});
$('refresh').addEventListener('click',()=>refresh().catch(e=>$('message').textContent=e.message));refresh().catch(()=>{});</script></body></html>
