name: HAM Staging Supabase Connection Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/staging-supabase-smoke.yml
permissions:
  contents: read
jobs:
  connection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only staging database connection test
        shell: bash
        run: |
          node <<'NODE'
          const url='https://ham-plus-udid-staging.onrender.com/api/certificates/orders/00000000-0000-4000-8000-000000000000';
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const response=await fetch(url,{signal:AbortSignal.timeout(85000)});
                const data=await response.json();
                if(response.status===404 && data.error==='الطلب غير موجود'){
                  console.log('PASS: staging app successfully queried Supabase; no order was created.');
                  return;
                }
                console.error('Unexpected staging status:',response.status,'reason:', ['قاعدة بيانات الطلبات غير مرتبطة بعد','خدمة الطلبات غير متاحة مؤقتًا','الطلب غير موجود'].includes(data?.error)?data.error:'unrecognized');
              }catch(e){console.error('Staging request failed:',e.name);}
              if(attempt<3)await pause(6000);
            }
            process.exitCode=1;
          })().catch(()=>{process.exitCode=1;});
          NODE
