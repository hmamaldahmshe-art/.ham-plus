name: Certificate order tests
on:
  pull_request:
    branches: [main]
jobs:
  node-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check server.js && node --check "server 2.js" && node --check certificate-orders.js
